name: Planche du profil

on:
  schedule:
    - cron: "40 22 * * *"  # tous les soirs vers 23h40 (heure de Paris en hiver)
  workflow_dispatch:        # bouton "Run workflow" pour lancer a la main
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "assets/**"
      - "parts/**"
      - ".github/workflows/stats.yml"

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generer profile.svg
        shell: pwsh
        env:
          # STATS_TOKEN est facultatif. Sans lui, le jeton automatique de GitHub suffit.
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
        run: ./scripts/stats.ps1 -User "${{ github.repository_owner }}" -Out profile.svg

      - name: Enregistrer si ca a change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile.svg profile-dark.svg profile-light.svg
          if git diff --cached --quiet; then
            echo "Pas de changement."
          else
            git commit -m "Mise a jour du profil"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
